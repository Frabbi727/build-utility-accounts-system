services:
  postgres:
    image: postgres:18-alpine
    container_name: uas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-utility_accounts}
      POSTGRES_USER: ${DB_USERNAME:-utility}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # Used by the init script to create the dedicated test database.
      TEST_DB_DATABASE: ${DB_TEST_DATABASE:-utility_accounts_test}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-utility} -d ${DB_DATABASE:-utility_accounts}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: uas-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
